<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Henris · 4 kl. — savaitės tvarkaraštis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#21242b;--grid:#dfe6ef;--accent:#1d5fad;--accent-soft:#eaf1f9;--paper:#fff;--muted:#6b7280;--nmpp:#fff4d6;--nmpp-line:#c98a00}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:"Atkinson Hyperlegible",Arial,sans-serif;color:var(--ink);background:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;background-color:var(--paper);line-height:1.45;font-size:16px}
.wrap{max-width:600px;margin:0 auto;padding:0 0 60px}
header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:3px solid var(--ink);padding:12px 16px 0}
.title{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1{font-size:20px;line-height:1.2}
h1 span{color:var(--accent)}
.tz{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:48px;padding:8px 6px 10px;border:1.5px solid var(--ink);border-bottom:none;background:var(--accent-soft);font-weight:700;font-size:14px;text-align:center;cursor:pointer;user-select:none}
.tab.active{background:var(--ink);color:var(--paper)}
.tab.today:not(.active){box-shadow:inset 0 -4px 0 var(--accent)}
.tab small{display:block;font-weight:400;font-size:11px;opacity:.8}
main{padding:14px 16px}
.day{display:none}.day.active{display:block}
.empty{color:var(--muted);text-align:center;padding:30px 0;font-size:17px}
.item{display:grid;grid-template-columns:78px 1fr;gap:10px;border:1.5px solid var(--ink);background:var(--paper);margin-bottom:8px;padding:10px 12px;align-items:start}
.item .time{font-weight:700;font-size:15px;line-height:1.3;white-space:nowrap}
.item .time small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.item .name{font-size:16px}
.item .name small{display:block;color:var(--muted);font-size:13px}
.item.nmpp{background:var(--nmpp);border-color:var(--nmpp-line)}
.item.nmpp .tag{display:inline-block;font-size:11px;font-weight:700;color:var(--paper);background:var(--nmpp-line);padding:1px 6px;border-radius:3px;margin-bottom:3px;letter-spacing:.5px}
.item.nmpp a{display:inline-block;margin-top:6px;font-weight:700;color:var(--accent);text-decoration:none;border:1.5px solid var(--accent);padding:5px 12px;border-radius:4px;background:var(--paper)}
.item.gap{border-style:dashed;color:var(--muted);background:transparent}
.legend{margin-top:18px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--grid);padding-top:8px}
.legend b{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="title"><h1>Henris · <span>4 kl.</span></h1><div class="tz" id="tz">Vilniaus laiku</div></div>
  <div class="tabs" id="tabs"></div>
</header>
<main id="main"></main>
</div>
<script>
const DAYS=[{"short": "Pr", "long": "pirm."}, {"short": "An", "long": "antr."}, {"short": "Tr", "long": "treč."}, {"short": "Kt", "long": "ketv."}, {"short": "Pe", "long": "penkt."}, {"short": "Še", "long": "šešt."}, {"short": "Sk", "long": "sekm."}];
const DATA=[[{"name": "Daugybos lentelė — 5 min", "nmpp": true, "link": false, "when": "Ryte", "note": "Kortelės arba Duolingo Math, prieš pamokas"}, {"from": "10.20", "to": "11.05", "name": "Matematika"}, {"from": "11.25", "to": "12.10", "name": "Lietuvių k. ir literatūra", "note": "4n"}, {"from": "12.30", "to": "13.15", "name": "Dailė"}, {"from": "13.25", "to": "14.10", "name": "Fizinis ugdymas"}, {"from": "14.20", "to": "15.05", "name": "Lietuvių k. ir literatūra", "note": "4n"}, {"name": "Matematika — 20 min", "nmpp": true, "link": true, "from": "15.10", "to": "15.30", "note": "Šios dienos užduotys ekrane"}, {"from": "16.00", "to": "16.45", "name": "Lietuvių k. ir literatūra", "note": "4lt"}, {"from": "16.50", "to": "17.35", "name": "Visuomeninis ugdymas", "note": "0,3 pamokos"}], [{"name": "Daugybos lentelė — 5 min", "nmpp": true, "link": false, "when": "Ryte", "note": "Kortelės arba Duolingo Math, prieš pamokas"}, {"from": "08.30", "to": "09.15", "name": "Visuomeninis ugdymas", "note": "4n"}, {"from": "09.25", "to": "10.10", "name": "Matematika"}, {"from": "11.25", "to": "12.10", "name": "Lietuvių k. ir literatūra", "note": "4n"}, {"from": "12.30", "to": "13.15", "name": "Anglų k."}, {"from": "13.25", "to": "14.10", "name": "Lietuvių k. ir literatūra", "note": "4n"}, {"from": "14.20", "to": "15.05", "name": "Matematika"}, {"name": "Skaitymas — 20 min", "nmpp": true, "link": true, "from": "15.10", "to": "15.30", "note": "Pirma klausimai → tada tekstas → pieštuku žymėk vardus"}, {"from": "16.00", "to": "16.45", "name": "Lietuvių k. ir literatūra", "note": "4lt"}, {"from": "16.50", "to": "17.35", "name": "Gamtos mokslai", "note": "0,3 pamokos"}], [{"name": "Daugybos lentelė — 5 min", "nmpp": true, "link": false, "when": "Ryte", "note": "Kortelės arba Duolingo Math, prieš pamokas"}, {"from": "10.20", "to": "11.05", "name": "Lietuvių k. ir literatūra", "note": "4n"}, {"from": "12.30", "to": "13.15", "name": "Anglų k."}, {"from": "13.25", "to": "14.10", "name": "Muzika"}, {"from": "14.20", "to": "15.05", "name": "Matematika"}, {"name": "Matematika — 20 min", "nmpp": true, "link": true, "from": "15.10", "to": "15.30", "note": "Šios dienos užduotys ekrane"}], [{"name": "Daugybos lentelė — 5 min", "nmpp": true, "link": false, "when": "Ryte", "note": "Kortelės arba Duolingo Math, prieš pamokas"}, {"from": "09.25", "to": "10.10", "name": "Tikyba"}, {"from": "10.20", "to": "11.05", "name": "Muzika"}, {"from": "11.25", "to": "12.10", "name": "Matematika"}, {"from": "12.30", "to": "13.15", "name": "Gamtos mokslai", "note": "4n"}, {"from": "13.25", "to": "14.10", "name": "Lietuvių k. ir literatūra", "note": "4n"}, {"from": "14.20", "to": "15.05", "name": "Lietuvių k. ir literatūra", "note": "4n"}, {"name": "Akys, ranka, raidės — 15 min", "nmpp": true, "link": true, "from": "15.10", "to": "15.30", "note": "Atsispausdintas lapas, su tėvais, be ekrano"}, {"from": "16.00", "to": "16.45", "name": "Lietuvių k. ir literatūra", "note": "4lt"}, {"from": "16.50", "to": "17.35", "name": "Etika / Lietuvių k. 4lt", "note": "lyginėmis savaitėmis"}], [{"name": "Daugybos lentelė — 5 min", "nmpp": true, "link": false, "when": "Ryte", "note": "Kortelės arba Duolingo Math, prieš pamokas"}, {"from": "10.20", "to": "11.05", "name": "Technologijos"}, {"from": "13.25", "to": "14.10", "name": "Fizinis ugdymas"}, {"from": "14.20", "to": "15.05", "name": "Fizinis ugdymas"}, {"name": "Schemos tekstiniams uždaviniams — 20 min", "nmpp": true, "link": true, "from": "15.10", "to": "15.30", "note": "Perskaityk → nupiešk → tik tada skaičiuok"}], [{"name": "Ilgoji sesija — 40–60 min", "nmpp": true, "link": true, "from": "10.00", "to": "11.00", "note": "Savarankiškai, su laikmačiu, be raginimo"}], []];
const LINK="https://kbl707.github.io/nmpp-trainer/";

// laiko juosta: tvarkaraštis Vilniaus laiku; jei telefonas kitoje zonoje – perskaičiuojam
function offsetMin(tz){const d=new Date();const f=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});const p=Object.fromEntries(f.formatToParts(d).map(x=>[x.type,x.value]));const asUTC=Date.UTC(p.year,p.month-1,p.day,p.hour%24,p.minute);return (asUTC-d.getTime())/60000;}
const localTZ=Intl.DateTimeFormat().resolvedOptions().timeZone||'Europe/Vilnius';
let shift=0;try{shift=Math.round(offsetMin(localTZ)-offsetMin('Europe/Vilnius'));}catch(e){}
function t(s){if(!s||!shift)return s;const [h,m]=s.split('.').map(Number);let tot=h*60+m+shift;tot=((tot%1440)+1440)%1440;return String(Math.floor(tot/60)).padStart(2,'0')+'.'+String(tot%60).padStart(2,'0');}
document.getElementById('tz').textContent=shift?('Rodoma tavo laiku ('+localTZ.split('/').pop()+', '+(shift>0?'+':'')+(shift/60)+' val.)'):'Vilniaus laiku';

const tabs=document.getElementById('tabs'),mainEl=document.getElementById('main');
const jsToday=(new Date().getDay()+6)%7; // 0=Pr
DAYS.forEach((d,i)=>{
  const tab=document.createElement('div');tab.className='tab'+(i===jsToday?' today':'');tab.innerHTML=d.short+'<small>'+d.long+'</small>';tab.onclick=()=>show(i);tabs.appendChild(tab);
  const sec=document.createElement('section');sec.className='day';
  const items=DATA[i]||[];
  if(!items.length){sec.innerHTML='<div class="empty">Laisva diena 🎉</div>';}
  items.forEach(it=>{
    const el=document.createElement('div');el.className='item'+(it.nmpp?' nmpp':'')+(it.gap?' gap':'');
    const time=it.from?('<div class="time">'+t(it.from)+(it.to?'<small>– '+t(it.to)+'</small>':'')+'</div>'):'<div class="time">'+(it.when||'')+'</div>';
    let name='<div class="name">'+(it.nmpp?'<span class="tag">NMPP</span><br>':'')+it.name+(it.note?'<small>'+it.note+'</small>':'')+(it.link?'<br><a href="'+LINK+'" target="_blank" rel="noopener">Atidaryti užduotis →</a>':'')+'</div>';
    el.innerHTML=time+name;sec.appendChild(el);
  });
  mainEl.appendChild(sec);
});
function show(i){[...tabs.children].forEach((x,k)=>x.classList.toggle('active',k===i));[...mainEl.children].forEach((x,k)=>x.classList.toggle('active',k===i));}
show(jsToday<DAYS.length?jsToday:0);
</script>
</body>
</html>
